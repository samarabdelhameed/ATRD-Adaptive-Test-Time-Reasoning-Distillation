[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "atrd"
version = "1.0.0"
description = "Adaptive Test-Time Reasoning Distillation — LoRA fine-tuning for NVIDIA Nemotron-3-Nano-30B"
readme = "README.md"
authors = [
    {name = "Samar Abdelhameed Ahmed"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "datasets>=2.19.0",
    "bitsandbytes>=0.43.0",
    "vllm>=0.5.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.66.0",
    "huggingface-hub>=0.22.0",
]

[project.scripts]
atrd-pipeline = "run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src/*"]
